apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadgen-worker
  namespace: leadgen
spec:
  replicas: 5
  selector:
    matchLabels:
      app: leadgen-worker
  template:
    metadata:
      labels:
        app: leadgen-worker
    spec:
      containers:
        - name: worker
          image: leadgen/worker:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - secretRef:
                name: leadgen-secrets
            - configMapRef:
                name: leadgen-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"

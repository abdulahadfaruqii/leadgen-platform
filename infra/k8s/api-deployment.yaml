apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadgen-api
  namespace: leadgen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: leadgen-api
  template:
    metadata:
      labels:
        app: leadgen-api
    spec:
      containers:
        - name: api
          image: leadgen/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: leadgen-secrets
            - configMapRef:
                name: leadgen-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: leadgen-api
  namespace: leadgen
spec:
  selector:
    app: leadgen-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
